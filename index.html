
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>MySound</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101014;color:#fff;font-family:Arial,sans-serif;padding-bottom:35px}
header{padding:25px 20px 12px}
h1{font-size:30px;margin:0;color:#b9ff35}
header p{color:#aaa;margin:7px 0}
nav{display:flex;gap:10px;padding:12px 16px}
button{border:0;border-radius:22px;padding:12px 17px;background:#292930;color:white;font-weight:bold;cursor:pointer}
button.active,.primary{background:#b9ff35;color:#111}
main{padding:10px 16px}
h2{font-size:21px}
.search{display:flex;gap:8px}
input{min-width:0;flex:1;padding:14px;border-radius:25px;border:1px solid #444;background:#24242b;color:white;font-size:16px}
#message{color:#aaa;font-size:14px;margin:14px 2px}
.song{display:flex;align-items:center;gap:12px;background:#202027;padding:10px;margin:10px 0;border-radius:12px}
.song img{width:105px;height:65px;object-fit:cover;border-radius:8px}
.song-info{flex:1;min-width:0}
.song-info strong{display:block;font-size:14px;line-height:1.3}
.song-info small{display:block;color:#aaa;margin-top:6px}
.song-actions{display:flex;flex-direction:column;gap:7px}
.song-actions button{padding:9px 11px;font-size:12px}
#player{margin-top:20px}
#player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.hidden{display:none}
.empty{color:#999;padding:20px 5px}
</style>
</head>
<body>
<header>
<h1>♫ MySound</h1>
<p>Tu música, tu biblioteca.</p>
</header>

<nav>
<button id="searchTab" class="active" onclick="showTab('search')">Buscar</button>
<button id="libraryTab" onclick="showTab('library')">Mi biblioteca</button>
</nav>

<main>
<section id="searchSection">
<h2>Buscar música</h2>
<form class="search" id="searchForm">
<input id="query" placeholder="Canción o artista..." required>
<button class="primary" type="submit">Buscar</button>
</form>
<div id="message">Busca una canción o artista en YouTube.</div>
<div id="results"></div>
</section>

<section id="librarySection" class="hidden">
<h2>Mi biblioteca</h2>
<div id="library"></div>
</section>

<div id="player"></div>
</main>

<script>
const API = "https://mysound-api.arromdaniii.workers.dev";
let library = JSON.parse(localStorage.getItem("mysound-library") || "[]");

function saveLibrary(){
  localStorage.setItem("mysound-library", JSON.stringify(library));
}

function showTab(tab){
  document.getElementById("searchSection").classList.toggle("hidden",tab!=="search");
  document.getElementById("librarySection").classList.toggle("hidden",tab!=="library");
  document.getElementById("searchTab").classList.toggle("active",tab==="search");
  document.getElementById("libraryTab").classList.toggle("active",tab==="library");
  document.getElementById("player").innerHTML="";
  if(tab==="library") renderLibrary();
}

function makeSong(item){
  const s=item.snippet;
  return {
    id:item.id.videoId,
    title:s.title,
    artist:s.channelTitle,
    image:s.thumbnails.medium?.url || s.thumbnails.default?.url || ""
  };
}

function songHTML(song, inLibrary=false){
  const safeTitle=escapeHTML(song.title);
  const safeArtist=escapeHTML(song.artist);
  return `
  <div class="song">
    <img src="${song.image}" alt="">
    <div class="song-info">
      <strong>${safeTitle}</strong>
      <small>${safeArtist}</small>
    </div>
    <div class="song-actions">
      <button class="primary" onclick="playSong('${song.id}')">▶</button>
      ${inLibrary
        ? `<button onclick="removeSong('${song.id}')">Quitar</button>`
        : `<button onclick="addSong('${song.id}')">＋ Guardar</button>`}
    </div>
  </div>`;
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

document.getElementById("searchForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const query=document.getElementById("query").value.trim();
  if(!query)return;

  const message=document.getElementById("message");
  const results=document.getElementById("results");
  message.textContent="Buscando música...";
  results.innerHTML="";

  try{
    const response=await fetch(API+"/search?q="+encodeURIComponent(query));
    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error?.message || data.error || "Error al buscar");
    }

    if(!data.items || data.items.length===0){
      message.textContent="No se han encontrado resultados.";
      return;
    }

    message.textContent="Resultados encontrados: "+data.items.length;
    results.innerHTML=data.items
      .filter(item=>item.id?.videoId)
      .map(item=>songHTML(makeSong(item)))
      .join("");
  }catch(error){
    message.textContent="No se pudo realizar la búsqueda: "+error.message;
  }
});

function addSong(id){
  const song=window.currentSongs?.find(s=>s.id===id);
  if(!song){
    const element=[...document.querySelectorAll(".song")];
    const index=library.findIndex(s=>s.id===id);
    if(index!==-1)return;
  }
  const item=lastResults.find(s=>s.id===id);
  if(!item)return;
  if(library.some(s=>s.id===id)){
    alert("Esta canción ya está en tu biblioteca.");
    return;
  }
  library.push(item);
  saveLibrary();
  alert("Canción guardada en tu biblioteca.");
}

let lastResults=[];
const originalSubmit=document.getElementById("searchForm");
originalSubmit.addEventListener("submit",()=>{lastResults=[];});
</script>

<script>
/* Funciones de biblioteca y reproducción */
const originalFetch=window.fetch;
const apiAddress="https://mysound-api.arromdaniii.workers.dev";

async function searchSongs(query){
  const response=await originalFetch(apiAddress+"/search?q="+encodeURIComponent(query));
  return response.json();
}

function playSong(id){
  document.getElementById("player").innerHTML=
    `<h2>Reproduciendo</h2>
    <iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1"
    title="Reproductor de YouTube" allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen></iframe>`;
}

function removeSong(id){
  library=library.filter(s=>s.id!==id);
  saveLibrary();
  renderLibrary();
}

function renderLibrary(){
  const container=document.getElementById("library");
  if(!library.length){
    container.innerHTML='<p class="empty">Todavía no has guardado canciones. Busca música y pulsa ＋ Guardar.</p>';
    return;
  }
  container.innerHTML=library.map(song=>songHTML(song,true)).join("");
}

/* Guarda los resultados de cada búsqueda */
document.getElementById("searchForm").addEventListener("submit",async()=>{
  const query=document.getElementById("query").value.trim();
  if(!query)return;
  try{
    const data=await searchSongs(query);
    lastResults=(data.items||[])
      .filter(item=>item.id?.videoId)
      .map(makeSong);
  }catch(e){}
});
</script>
</body>
</html>
